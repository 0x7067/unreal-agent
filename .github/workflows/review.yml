name: Review

# pull_request_target runs this file from the base branch, so a pull request
# cannot edit the workflow that holds OPENROUTER_API_KEY. The head is checked
# out only as files to review; nothing from it is built here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: ${{ (github.event.action == 'edited' && github.event.changes.base == null) && github.run_id || format('review-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
    steps:
      # unreal-review is built from the base commit, never the pull request head.
      # A PR that changes the reviewer takes effect only after it merges.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: base/go.mod
          cache: false
      - name: Build unreal-review from the base commit
        run: |
          go -C base build -trimpath -o "$RUNNER_TEMP/bin/unreal-review" ./cmd/unreal-review
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          rm -rf base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Review pull request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UNREAL_HARNESS_LLM_PROVIDER: openrouter
          UNREAL_HARNESS_LLM_MODEL: ${{ vars.UNREAL_HARNESS_LLM_MODEL }}
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.repository }}#${{ github.event.pull_request.number }}
        # exec replaces the step shell, whose environment holds the key, so the
        # review shell cannot read the key from that shell's /proc/<pid>/environ.
        run: |
          exec unreal-review run --pr "$PULL_REQUEST" --out "$RUNNER_TEMP/findings.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unreal-review-findings
          path: ${{ runner.temp }}/findings.jsonl
          retention-days: 7
      - name: Upload review session
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unreal-review-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/.local/state/unreal-agent/sessions/
          if-no-files-found: warn

  post:
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    steps:
      # Base commit only. This job does not check out the pull request head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build unreal-review from the base commit
        run: go build -trimpath -o "$RUNNER_TEMP/bin/unreal-review" ./cmd/unreal-review
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unreal-review-findings
          path: ${{ runner.temp }}/findings
      - name: Post review
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.repository }}#${{ github.event.pull_request.number }}
        run: |
          "$RUNNER_TEMP/bin/unreal-review" render github --pr "$PULL_REQUEST" "$RUNNER_TEMP/findings/findings.jsonl"
